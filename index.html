<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerar Credenciais</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/5968/5968890.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- JsBarcode -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.0/dist/JsBarcode.all.min.js"></script>
    <!-- QRCode.js -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        .card {
            width: 85.6mm;
            height: 53.98mm;
            margin: 15px auto;
            border: 3px solid #0ea5e9;
            background: white;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            page-break-inside: avoid;
        }
        .barcode, .qrcode {
            width: 100% !important;
            max-width: 100% !important;
            height: auto !important;
        }
        .qrcode {
            max-height: 38mm;
        }
        
        @media print {
            body * { visibility: hidden; }
            .print-area, .print-area * { visibility: visible; }
            .print-area { position: absolute; left: 0; top: 0; width: 100%; }
            .card { margin: 6mm auto; box-shadow: none; border: 2px solid #0ea5e9; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen">
    <div class="max-w-lg mx-auto p-6">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
                🔧 Gerar Credenciais
            </h1>
            <p class="text-zinc-400 mt-2">Code 128 + QR Code • Cartões</p>
        </div>

        <div class="space-y-6 bg-zinc-900 p-8 rounded-2xl border border-zinc-800">
            <div>
                <label class="block text-sm font-medium text-zinc-400 mb-2">Nome / Usuário</label>
                <input type="text" id="nome" 
                       class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 focus:outline-none focus:border-cyan-500 text-white"
                       placeholder="Ex: Ricardo Junior">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-zinc-400 mb-2">Senha</label>
                <input type="text" id="senha" 
                       class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 focus:outline-none focus:border-cyan-500 text-white"
                       placeholder="Digite sua senha">
            </div>

            <!-- Opções de QR Code -->
            <div class="bg-zinc-800/50 p-4 rounded-xl border border-zinc-700">
                <p class="text-sm text-zinc-400 mb-3">Incluir QR Code de:</p>
                <div class="flex flex-wrap gap-4 text-sm">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="qrNome" checked class="w-4 h-4 accent-cyan-500">
                        Nome
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="qrSenha" class="w-4 h-4 accent-cyan-500">
                        Senha
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="qrAmbos" class="w-4 h-4 accent-cyan-500">
                        Nome + Senha
                    </label>
                </div>
            </div>

            <div class="flex gap-4">
                <button onclick="gerarCredenciais()" 
                        class="flex-1 bg-cyan-500 hover:bg-cyan-600 transition py-4 rounded-2xl font-semibold text-lg">
                    Gerar Cartões
                </button>
                
                <button onclick="resetForm()" 
                        class="px-8 bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 rounded-2xl font-medium transition">
                    Reset
                </button>
            </div>
        </div>

        <!-- Área de Impressão -->
        <div id="printArea" class="hidden mt-10 print-area">
            <h2 class="text-2xl font-semibold text-center mb-6 text-cyan-400 no-print">Cartões Gerados — Pronto para Imprimir</h2>
            
            <!-- Cartão Nome (Code 128) -->
            <div class="card" id="cardNome">
                <div class="absolute inset-0 flex flex-col items-center justify-center p-4">
                    <div class="flex items-center gap-2 mb-2">
                        <span class="text-cyan-500 text-xl">⚙️</span>
                        <span class="text-sm font-bold tracking-widest text-zinc-600">NOME</span>
                    </div>
                    <svg id="barcodeNome" class="barcode"></svg>
                    <div id="textoNome" class="mt-3 text-sm font-bold tracking-widest text-zinc-800"></div>
                </div>
            </div>

            <!-- Cartão Senha (Code 128) -->
            <div class="card" id="cardSenha">
                <div class="absolute inset-0 flex flex-col items-center justify-center p-4">
                    <div class="flex items-center gap-2 mb-2">
                        <span class="text-cyan-500 text-xl">⚙️</span>
                        <span class="text-sm font-bold tracking-widest text-zinc-600">SENHA</span>
                    </div>
                    <svg id="barcodeSenha" class="barcode"></svg>
                    <div id="textoSenhaMascarada" class="mt-3 text-sm font-bold tracking-[4px] text-zinc-800"></div>
                </div>
            </div>

            <!-- Cartões QR Code (aparecem só se marcado) -->
            <div id="qrCards"></div>

            <p class="text-center text-zinc-500 mt-6 text-sm no-print">
                Pressione <strong>Ctrl + P</strong> → Papel A4 → Sem margens
            </p>
        </div>
    </div>

    <script>
        function gerarCredenciais() {
            const nome = document.getElementById("nome").value.trim();
            const senha = document.getElementById("senha").value.trim();
            
            if (!nome || !senha) {
                alert("❌ Preencha o Nome e a Senha!");
                return;
            }

            const nomeUpper = nome.toUpperCase();
            document.getElementById("textoNome").textContent = nomeUpper;
            document.getElementById("textoSenhaMascarada").textContent = "*".repeat(Math.max(senha.length, 8));

            // Barcodes Code 128
            const altura = Math.max(24, 36 - (nome.length * 0.3));

            JsBarcode("#barcodeNome", nomeUpper, {
                format: "CODE128",
                width: 1.4,
                height: altura,
                displayValue: false,
                margin: 6
            });

            JsBarcode("#barcodeSenha", senha, {
                format: "CODE128",
                width: 1.4,
                height: Math.max(24, 36 - (senha.length * 0.3)),
                displayValue: false,
                margin: 6
            });

            // QR Codes
            const qrContainer = document.getElementById("qrCards");
            qrContainer.innerHTML = "";

            const gerarQR = (texto, titulo) => {
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <div class="absolute inset-0 flex flex-col items-center justify-center p-4">
                        <div class="text-sm font-bold tracking-widest text-zinc-600 mb-2">${titulo}</div>
                        <div id="qr-${Date.now()}" class="qrcode"></div>
                        <div class="mt-2 text-xs text-zinc-500 text-center px-2">\( {texto.substring(0, 40)} \){texto.length > 40 ? "..." : ""}</div>
                    </div>
                `;
                qrContainer.appendChild(card);

                const qrDiv = card.querySelector(".qrcode");
                QRCode.toCanvas(qrDiv, texto, {
                    width: 160,
                    margin: 1,
                    color: { dark: "#000000", light: "#ffffff" }
                }, (err) => {
                    if (err) console.error(err);
                });
            };

            if (document.getElementById("qrNome").checked) {
                gerarQR(nomeUpper, "QR CODE — NOME");
            }
            if (document.getElementById("qrSenha").checked) {
                gerarQR(senha, "QR CODE — SENHA");
            }
            if (document.getElementById("qrAmbos").checked) {
                gerarQR(`\( {nomeUpper}| \){senha}`, "QR CODE — NOME + SENHA");
            }

            document.getElementById("printArea").classList.remove("hidden");
            document.getElementById("printArea").scrollIntoView({ behavior: "smooth" });
        }

        function resetForm() {
            document.getElementById("nome").value = "";
            document.getElementById("senha").value = "";
            document.getElementById("printArea").classList.add("hidden");
            document.getElementById("qrCards").innerHTML = "";
            document.getElementById("qrNome").checked = true;
            document.getElementById("qrSenha").checked = false;
            document.getElementById("qrAmbos").checked = false;
        }

        document.getElementById("senha").addEventListener("keypress", (e) => {
            if (e.key === "Enter") gerarCredenciais();
        });
    </script>
</body>
    </html>
